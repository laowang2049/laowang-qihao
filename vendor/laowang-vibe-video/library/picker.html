<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>老王 vibe video · 341 画风选型</title>
<style>
  :root{
    --ink:#15171c; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --card:#fff;
    --accent:#111827; --accent2:#c2410c; --ok:#0f766e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
       -webkit-text-size-adjust:100%;}
  body.lock{overflow:hidden}

  header{background:#fff;padding:12px 22px 10px;display:flex;align-items:baseline;gap:14px;
         flex-wrap:wrap;border-bottom:1px solid #f1f2f4}
  .brand{font-size:25px;font-weight:700;letter-spacing:.06em;color:var(--accent2);white-space:nowrap}
  .brand small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
  .how{font-size:12.5px;color:var(--muted);background:#f9fafb;border:1px solid var(--line);
       border-radius:6px;padding:3px 9px}
  .how b{color:var(--accent2)}
  .how-m{display:none}
  .count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}

  .bars{padding:8px 22px 9px;background:#fff;border-bottom:1px solid var(--line);
        position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:7px}
  .catrow{display:flex;gap:8px;align-items:center;width:100%;overflow-x:auto;
          scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .catrow::-webkit-scrollbar{display:none}
  .catrow #cats{display:flex;gap:8px;flex-wrap:nowrap}
  .filterrow{display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;color:#374151;border-radius:999px;
        padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .chip:hover{border-color:#9ca3af}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=search]{flex:1;min-width:170px;max-width:300px;border:1px solid var(--line);
        border-radius:8px;padding:7px 11px;font-size:13px;outline:none;background:#fff}
  input[type=search]:focus{border-color:#9ca3af}

  main{display:flex;gap:0;align-items:flex-start}
  #grid{flex:1;padding:16px 22px 60px;display:grid;gap:14px;
        grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        cursor:pointer;transition:box-shadow .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .card.on{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(194,65,12,.18)}
  .thumb{width:100%;aspect-ratio:16/9;background:#eceff3;display:block;object-fit:cover}
  .noimg{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
         background:repeating-linear-gradient(45deg,#eef0f3,#eef0f3 8px,#e6e9ee 8px,#e6e9ee 16px);
         color:#9aa1ab;font-size:12px;letter-spacing:.02em;text-align:center;padding:0 6px}
  .meta{padding:9px 11px 11px}
  .nm{font-size:13px;font-weight:600;line-height:1.4;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .id{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11px;border-radius:4px;padding:1px 5px;background:#f3f4f6;color:#6b7280}
  .tag.warn{background:#fef3c7;color:#92400e}

  /* ---- 桌面：右侧常驻详情面板（按钮钉在面板底部，不随内容滚走） ---- */
  aside{width:392px;position:sticky;top:var(--top,124px);height:calc(100vh - var(--top,124px));
        background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  aside .empty{color:var(--muted);padding:40px 22px;font-size:13px}
  .panel{position:relative;display:flex;flex-direction:column;height:100%;min-height:0;flex:1 1 auto}
  .panel-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 20px 8px;
                -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .panel-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--line);background:#fff}
  .handle{display:none}
  .x{display:none}
  .big{width:100%;border-radius:8px;margin-bottom:14px;background:#eceff3;display:block;min-height:60px}
  .nopic{border:1px dashed var(--line);border-radius:8px;padding:18px 14px;margin-bottom:14px;
         background:#fafafa;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.7}
  aside h2{font-size:19px;margin:0 0 4px;line-height:1.35}
  aside .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .kv{font-size:13px;margin:10px 0;color:#374151}
  .kv b{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:2px}
  .go{width:100%;padding:13px;border:0;border-radius:9px;background:var(--accent2);
      color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;letter-spacing:.04em}
  .go:hover{background:#9a3412}
  .go:active{transform:translateY(1px)}
  .hint{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
  .now{font-size:12px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;
       border-radius:6px;padding:3px 8px}
  .empty{color:var(--muted);padding:40px 22px;font-size:13px}

  #sheetMask{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:55}

  #mask{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;
        align-items:center;justify-content:center;z-index:99;padding:16px;overflow:auto}
  #mask.on{display:flex}
  .done{background:#fff;border-radius:14px;padding:26px 32px 24px;max-width:460px;width:100%;
        max-height:calc(100vh - 32px);overflow:auto;text-align:center}
  .done .k{font-size:12px;color:var(--ok);letter-spacing:.08em}
  .done .k.bad{color:var(--accent2)}
  .code{width:100%;margin:10px 0 4px;border:1px solid var(--line);background:#fbfbfc;border-radius:9px;
        padding:11px 12px;font:700 30px/1.2 ui-monospace,Consolas,"Courier New",monospace;
        letter-spacing:.12em;text-align:center;color:var(--accent2);outline:none;cursor:text}
  .code:focus{border-color:#9ca3af}
  .done .n{font-size:15px;color:#374151;margin-top:6px}
  .done .tip{margin-top:16px;font-size:13px;color:#4b5563;line-height:1.7;
             background:#f9fafb;border-radius:8px;padding:11px 13px;text-align:left}
  .done .row{display:flex;gap:8px;margin-top:16px}
  .done button{flex:1;padding:10px 14px;border:1px solid var(--line);background:#fff;
               border-radius:8px;cursor:pointer;font-size:13.5px}
  .done button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- 平板 / 手机：详情改成底部抽屉，按钮常驻在抽屉底部 ---- */
  @media (max-width:1023px){
    main{display:block}
    .how-d{display:none}
    .how-m{display:inline}
    #grid{padding:14px 16px 72px;gap:12px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
    aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;
          max-height:86vh;max-height:86dvh;border-left:0;border-radius:16px 16px 0 0;
          box-shadow:0 -10px 34px rgba(0,0,0,.22);z-index:60;
          transform:translateY(103%);transition:transform .26s cubic-bezier(.32,.72,0,1);
          will-change:transform}
    aside.open{transform:translateY(0)}
    aside .empty{display:none}
    aside .panel{height:auto;max-height:100%}
    .handle{display:block;flex:none;width:40px;height:4px;border-radius:2px;
            background:#d5d8de;margin:9px auto 5px}
    .x{display:flex;align-items:center;justify-content:center;position:absolute;right:12px;top:10px;
       width:32px;height:32px;padding:0 0 2px;border:0;border-radius:50%;background:#f3f4f6;
       color:#4b5563;font-size:19px;line-height:1;cursor:pointer;z-index:3}
    .panel-scroll{padding:2px 18px 6px}
    .panel-foot{padding:10px 18px calc(12px + env(safe-area-inset-bottom));
                box-shadow:0 -6px 18px rgba(17,24,39,.06)}
    .panel-foot .hint{display:none}
    .big{margin-top:10px;aspect-ratio:16/9;object-fit:cover;background:#f3f4f6;max-height:34vh}
    .nopic{margin-top:10px}
    aside h2{font-size:18px}
    .go{padding:14px;font-size:16px}
    #sheetMask.on{display:block}
  }

  /* ---- 横屏手机：竖向空间紧张，图缩一点，把位置让给文字 ---- */
  @media (max-height:480px){
    .big{max-height:22vh}
    aside h2{font-size:16px}
    .kv{margin:7px 0}
  }

  /* ---- 手机 ---- */
  @media (max-width:767px){
    header{padding:9px 14px 8px;gap:8px}
    .brand{font-size:19px}
    .brand small{display:none}
    .how{padding:2px 8px;font-size:11.5px}
    .count{font-size:11.5px}
    .bars{padding:7px 14px 8px;gap:6px}
    .chip{padding:6px 12px;font-size:12.5px}
    #f-full{display:none}
    input[type=search]{flex:1 1 130px;min-width:130px;max-width:none;padding:6px 10px;font-size:16px}
    #grid{padding:12px 12px 64px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
    .meta{padding:8px 9px 9px}
    .nm{font-size:12.5px}
    .id{font-size:11.5px;gap:5px}
    .tag{font-size:10.5px}
    .noimg{font-size:11px}
    #mask{padding:16px}
    .done{padding:22px 18px 18px;border-radius:14px}
    .code{font-size:26px;letter-spacing:.08em;padding:10px}
    .done .n{font-size:14px}
    .done .row{flex-direction:column;gap:8px}
    .done button{padding:12px}
  }
</style>
</head>

ords":["2D"],"still":"prompts/O_奥斯卡98部/O6_乱世春秋.jpg"},{"id":"O7","name":"一夜风流（It Happened One Night）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"1934 年的黑白橡皮管卡通：粗细变化的墨线、饼切眼、白手套，赛璐璐平涂叠在灰阶水彩背景上，带胶片颗粒。和电影同一年，公路喜剧的笑点也适合卡通的节奏。","fit":"","quality":"full","prompt_chars":1766,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O7_一夜风流.jpg"},{"id":"O8","name":"叛舰喋血记（Mutiny on the Bounty）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"18 世纪英国海军部海图的铜版画：恒向线、罗盘玫瑰、水深数字、手工淡彩，邦蒂号是图上的一幅船舶插画。这部片讲的是一次航行，所以整段都留在海图上。","fit":"","quality":"full","prompt_chars":1628,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O8_叛舰喋血记.jpg"},{"id":"O9","name":"歌舞大王齐格飞（The Great Ziegfeld）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"用 three.js 建的旋转螺旋“婚礼蛋糕”舞台，米高梅银色黑白：缎面、雪纺和鸵鸟羽毛衬在深黑里，只有 Clawd 是颜色。《A Pretty Girl Is Like a Melody》那座 175 级的螺旋舞台是这部片的名场面。","fit":"","quality":"full","prompt_chars":1659,"keywords":["3D·B&W"],"still":"prompts/O_奥斯卡98部/O9_歌舞大王齐格飞.jpg"},{"id":"O10","name":"左拉传（The Life of Emile Zola）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"报纸活字印刷加 1890 年代线刻插图：木活字大标题、密排铅字正文，泛黄新闻纸上的油墨外扩和缺墨，人物用排线画。这部片最有名的画面就是 1898 年 1 月 13 日《震旦报》的《我控诉》头版。","fit":"","quality":"full","prompt_chars":1758,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O10_左拉传.jpg"},{"id":"O11","name":"浮生若梦（You Can't Take It with You）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"30 年代 WPA 丝网海报：六色不透明平涂油墨、分色渐变、轻微套印错位，印在棉浆纸上。1936–39 年联邦艺术计划的海报就是这部片同年代的美国平面语言，也和第 10 部的报纸拉开距离。","fit":"","quality":"full","prompt_chars":1664,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O11_浮生若梦.jpg"},{"id":"O12","name":"乱世佳人（Gone with the Wind）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"厚涂油画：刮刀色块、颜料堆起的棱，Technicolor 的热度——从金色烧到血红的天空、红土、黑色剪影。全片的色彩从《乱世佳人》开始降临，第一张满色画面就是夕阳下的塔拉。","fit":"","quality":"full","prompt_chars":1871,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O12_乱世佳人.jpg"},{"id":"O13","name":"蝴蝶梦（Rebecca）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"粗纹纸上的炭笔画：天鹅绒般的黑、抹开的灰，月光和雾用橡皮擦出来。希区柯克的《蝴蝶梦》是一场黑白哥特梦，庄园先在雾里、后在火里，炭笔两样都画得出来。","fit":"","quality":"full","prompt_chars":1778,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O13_蝴蝶梦.jpg"},{"id":"O14","name":"青山翠谷（How Green Was My Valley）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"用 1941 年原海报金黄加绿配色的不透明水粉：扎实的色块、煤黑的渣山、Kyffin Williams 式厚重的深色山体和断续描边。用水粉而不用木刻，和第 3 部区分开；画的是矿工唱着歌走下山谷回家。","fit":"","quality":"full","prompt_chars":1695,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O14_青山翠谷.jpg"},{"id":"O15","name":"忠勇之家（Mrs. Miniver）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"二战英国本土战线的石印海报：砖红、深绿、奶油、灰蓝的有限套色，阴影是石版蜡笔颗粒。配影片结尾：被炸穿屋顶的乡村教堂里全村唱诗，喷火式战机从破洞上方飞过。","fit":"","quality":"full","prompt_chars":1773,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O15_忠勇之家.jpg"},{"id":"O16","name":"卡萨布兰卡（Casablanca）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"影片本身的样子：Arthur Edeson 的片厂黑白，画成精修剧照：带眼神光的柔焦特写、百叶窗投影、烟雾里的光柱。扮里克的 Clawd 是唯一的颜色。","fit":"","quality":"full","prompt_chars":1706,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O16_卡萨布兰卡.jpg"},{"id":"O17","name":"与我同行（Going My Way）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"逆光的哥特彩色玻璃：铅条拼起的色玻璃、灰调描出的人脸、沙特尔蓝和宝石红边框，彩光洒在教堂地上。奥马利神父和唱诗班嵌在窗里，头顶是金色星章。","fit":"","quality":"full","prompt_chars":1691,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O17_与我同行.jpg"},{"id":"O18","name":"失去的周末（The Lost Weekend）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"画面是打出来的：等宽字符落在 pica 网格上，灰阶靠字符疏密和叠打，色带墨色不匀。唐抱着打字机去当铺，于是整条街由打字机打出；Clawd 用橙色色带打。","fit":"","quality":"full","prompt_chars":1712,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O18_失去的周末.jpg"},{"id":"O19","name":"黄金时代（The Best Years of Our Lives）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"1946 年画报的新闻摄影跨页：铜版纸上的粗黑网点、中缝折痕、叠印的图片说明。深焦里拆光的 B-17 排到地平线；Clawd 单独印在专色橙版上，是唯一的颜色。","fit":"","quality":"full","prompt_chars":1684,"keywords":["2.5D·B&W"],"still":"prompts/O_奥斯卡98部/O19_黄金时代.jpg"},{"id":"O20","name":"君子协定（Gentleman's Agreement）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"40 年代杂志插画式的石墨铅笔：先打构图线，再一遍遍平行排线，擦抹暗部、橡皮提亮。画面围绕酒店前台一次客气的拒绝逐步画出，只有 Clawd 是彩色铅笔。","fit":"","quality":"full","prompt_chars":1702,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O20_君子协定.jpg"},{"id":"O21","name":"王子复仇记（Hamlet）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"实时 3D 的艾尔西诺，高反差深焦黑白：体积雾、湿石头、碎成蕾丝白沫的海浪、银盐颗粒。照奥利维耶片中的城堡、雾中城垛和礁石来拍；Clawd 是唯一的颜色。","fit":"","quality":"full","prompt_chars":1703,"keywords":["3D·B&W"],"still":"prompts/O_奥斯卡98部/O21_王子复仇记.jpg"},{"id":"O22","name":"国王班底（All the King's Men）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"南方竞选海报的木活字凸版：红、蓝、黑三色油墨印在米黄纸上，实地有木纹，供墨不匀，版间错位，肖像走半调网点。这是斯塔克的竞选集会，Clawd 用第四版橙墨印。","fit":"","quality":"full","prompt_chars":1762,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O22_国王班底.jpg"},{"id":"O23","name":"彗星美人（All About Eve）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"艾尔·赫希菲尔德的百老汇漫画：粗细变化的流畅墨线、黑块对白、大量留白，每人只抓一个夸张特征。这部片讲剧场，派对就画成报纸剧场版漫画；Clawd 是唯一的颜色。","fit":"","quality":"full","prompt_chars":1616,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O23_彗星美人.jpg"},{"id":"O24","name":"一个美国人在巴黎（An American in Paris）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"拉乌尔·杜飞的水彩：快速的蓝黑墨线，底下是钴蓝、柠檬黄、玫瑰红的透明色块，线和色永远对不齐。影片结尾的芭蕾布景就是照杜飞画的，协和广场和舞者都用他的画法。","fit":"","quality":"full","prompt_chars":1739,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O24_一个美国人在巴黎.jpg"},{"id":"O25","name":"戏王之王（The Greatest Show on Earth）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"Strobridge 马戏团彩色石印：铬黄、朱红、钴蓝平涂，粗黑轮廓，带网点、错版和石版颗粒。德米尔的大帐篷画成三圈海报，Clawd 扮塞巴斯蒂安做空中接人。","fit":"","quality":"full","prompt_chars":1773,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O25_戏王之王.jpg"},{"id":"O26","name":"乱世忠魂（From Here to Eternity）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"1953 年的高调黑白：硬朗阳光、压暗的天空、泛白的浪沫、映着天的湿沙，银盐颗粒和光晕。拍哈洛纳海湾浪里那一吻；坐在熔岩上吹军号的 Clawd 是唯一的颜色。","fit":"","quality":"full","prompt_chars":1633,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O26_乱世忠魂.jpg"},{"id":"O27","name":"码头风云（On the Waterfront）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"本·沙恩的社会现实主义：颤抖的转印墨线，下面是错开的平涂蛋彩色块，大手长脸的工人，颜色克制在灰蓝、砖红、赭黄。沙恩画的就是码头工人和工会，正是这部片的世界。","fit":"","quality":"full","prompt_chars":1731,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O27_码头风云.jpg"},{"id":"O28","name":"君子好逑（Marty）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"1955 年的电视录像，在布朗克斯暖色客厅的电视里播：扫描线、荧光晕、圆角凸屏、雪花，只有 Clawd 有颜色。原作是直播电视剧，所以当电视拍。","fit":"","quality":"full","prompt_chars":1704,"keywords":["2D","(B&W","screen)"],"still":"prompts/O_奥斯卡98部/O28_君子好逑.jpg"},{"id":"O29","name":"环游地球八十天（Around the World in 80 Days）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"50 年代平面几何卡通：色块和墨线错位套印、墨线断续、奶油纸上的蜡笔颗粒。本片 6 分钟的片尾动画就出自 Saul Bass，正是这种现代主义画法。","fit":"","quality":"full","prompt_chars":1772,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O29_环游地球八十天.jpg"},{"id":"O30","name":"桂河大桥（The Bridge on the River Kwai）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"钉在绘图桌上的总布置图：普鲁士蓝底上的白线、折痕、水渍和红铅笔修改。电影讲一个执意把桥造好的上校，所以把桥画成他的工程图。","fit":"","quality":"full","prompt_chars":1663,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O30_桂河大桥.jpg"},{"id":"O31","name":"金粉世界（Gigi）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"图卢兹-罗特列克式彩色石印：大块平涂、飞白轮廓、用喷溅墨点代替网点、讽刺漫画式面孔。琪琪的高光时刻是走进马克西姆餐厅、全巴黎回头盯着她，正是罗特列克画过的巴黎。","fit":"","quality":"full","prompt_chars":1741,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O31_金粉世界.jpg"},{"id":"O32","name":"宾虚（Ben-Hur）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"程序生成的 3D 大竞技场，宽银幕史诗光感：沙漠烈日、沙尘、大理石和金色，特艺七彩调色加 65mm 颗粒。战车赛是全片最有名的段落，就直接拍比赛，头顶是海报上的金色巨神。","fit":"","quality":"full","prompt_chars":1879,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O32_宾虚.jpg"},{"id":"O33","name":"桃色公寓（The Apartment）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"Saul Bass 式的白线在黑底上滑入，搭出电影最有名的一点透视无尽办公大厅，再填上灰调。本片片头就是 Bass 做的；全画面唯一的暖色是 Clawd 和钥匙牌。","fit":"","quality":"full","prompt_chars":1598,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O33_桃色公寓.jpg"},{"id":"O34","name":"西区故事（West Side Story）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"红橙特艺七彩晚霞下的上西区 3D 街区，饱和、舞台化：红砖、之字形消防梯、屋顶水塔、能摆姿势的舞者人偶。重演电影的俯拍开场、Jets 打响指和海报上那一跃。","fit":"","quality":"full","prompt_chars":1725,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O34_西区故事.jpg"},{"id":"O35","name":"阿拉伯的劳伦斯（Lawrence of Arabia）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"看得见笔触方向的史诗海报水粉，冷暖对比强烈：琥珀色沙漠对钴蓝天空。《阿拉伯的劳伦斯》原海报就是 Howard Terpning 用这种画法画的。","fit":"","quality":"full","prompt_chars":1681,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O35_阿拉伯的劳伦斯.jpg"},{"id":"O36","name":"汤姆·琼斯（Tom Jones）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"乔治王时代的讽刺版画：霍加斯式粗细变化的刻线和有方向的排线，上面刷罗兰森式鲜艳的手工淡彩，稍稍出线，再加一个对白气泡。电影本身就在模仿霍加斯笔下的 18 世纪英国。","fit":"","quality":"full","prompt_chars":1717,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O36_汤姆·琼斯.jpg"},{"id":"O37","name":"窈窕淑女（My Fair Lady）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"快速、带飞白的墨线，配粉色和品红水彩晕染、甩点，四周化进白纸。1964 年原海报就是 Bob Peak 的墨线加粉彩；场景是 Cecil Beaton 设计的黑白阿斯科特。","fit":"","quality":"full","prompt_chars":1694,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O37_窈窕淑女.jpg"},{"id":"O38","name":"音乐之声（The Sound of Music）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"绘本感的 3D 程序阿尔卑斯：饱和的翠绿、钴蓝、雪白，雕塑感的山脊，棉花团积云，风吹过草地的草浪。重演开场的直升机航拍，最后落到山顶转圈的玛丽亚。","fit":"","quality":"full","prompt_chars":1705,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O38_音乐之声.jpg"},{"id":"O39","name":"日月精忠（A Man for All Seasons）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"古典大师油画肖像：平滑罩染塑形、一根根画出的毛领、天鹅绒高光、逐环刻画的金链，再加旧光油和龟裂纹。霍尔拜因 1527 年亲手画过托马斯·莫尔，这里用的就是他的构图。","fit":"","quality":"full","prompt_chars":1677,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O39_日月精忠.jpg"},{"id":"O40","name":"炎热的夜晚（In the Heat of the Night）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"三色 Risograph 印刷：深蓝、海报橙红、荧光粉，带网点、颗粒和套色错位；光是用「少上墨」印出来的。呼应 1967 年海报的橙红热浪底和黑色剪影。","fit":"","quality":"full","prompt_chars":1697,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O40_炎热的夜晚.jpg"},{"id":"O41","name":"雾都孤儿（Oliver!）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"维多利亚玩具纸剧场：手工上色的石印卡纸人物留着剪刀白边，景片分层插在滑杆上，镀金台口下的烛光脚灯把影子投上景片。《雾都孤儿》是歌舞片，正好搬上维多利亚家庭小舞台。","fit":"","quality":"full","prompt_chars":1758,"keywords":["2.5D"],"still":"prompts/O_奥斯卡98部/O41_雾都孤儿.jpg"},{"id":"O42","name":"午夜牛郎（Midnight Cowboy）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"沃霍尔的照片丝网：黑色网点照片层印得不匀，错位地压在松散的平涂色块上，底是银色，画面重复两次、三次。片里就有沃霍尔工厂式的派对，而他画的猫王正是牛仔。","fit":"","quality":"full","prompt_chars":1846,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O42_午夜牛郎.jpg"},{"id":"O43","name":"巴顿将军（Patton）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"仿 1940 年代美军战争债券海报的石印画法：分级平涂的褶皱、深色轮廓、网点阴影、泛黄的纸。对应《巴顿将军》开场：小小的将军站在一面占满舞台的巨幅国旗前训话。","fit":"","quality":"full","prompt_chars":1721,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O43_巴顿将军.jpg"},{"id":"O44","name":"法国贩毒网（The French Connection）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"整条布鲁克林高架铁下的大街用 3D 建出来，再调成粗颗粒 16mm：冷灰、暗部偏青、高反差、片门抖动。这部片最有名的就是高架铁下的追车，3D 才拍得出那种速度。","fit":"","quality":"full","prompt_chars":1770,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O44_法国贩毒网.jpg"},{"id":"O45","name":"教父（The Godfather）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"深琥珀和赭褐的油画，只有顶光落下的地方是暖的：暗部是透明的薄罩染，受光边缘是厚涂。重现戈登·威利斯在“I believe in America”那间书房里的顶光。","fit":"","quality":"full","prompt_chars":1763,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O45_教父.jpg"},{"id":"O46","name":"骗中骗（The Sting）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"Leyendecker、Rockwell 一路的杂志插画：块面受光、平行笔触、利落的深色轮廓。片中章节卡就仿《星期六晚邮报》封面，1936 年的下注厅也照这个画。","fit":"","quality":"full","prompt_chars":1690,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O46_骗中骗.jpg"},{"id":"O47","name":"教父2（The Godfather Part II）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"世纪之交的调色银盐照片，手工刷色：棕褐调、柔焦、银盐颗粒、霉斑、裂角，局部淡淡的红、蓝、铜绿。画的是 1901 年少年维托抵达埃利斯岛，像 Lewis Hine 的照片。","fit":"","quality":"full","prompt_chars":1777,"keywords":["2.5D"],"still":"prompts/O_奥斯卡98部/O47_教父2.jpg"},{"id":"O48","name":"飞越疯人院（One Flew Over the Cuckoo's Nest）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"仿爱德华·霍珀的安静写实：大块平整的淡绿墙面、低角度晨光投下的硬边平行四边形、彼此隔开的人。正合《飞越疯人院》的病房：日光灯下的秩序，被一次出逃打破。","fit":"","quality":"full","prompt_chars":1711,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O48_飞越疯人院.jpg"},{"id":"O49","name":"洛奇（Rocky）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"清晨的费城整个做成 3D，从肉库到博物馆 72 级台阶，调成 70 年代 35mm：冷蓝天、低低的金色太阳、长影子、薄雾、细颗粒。跑上台阶和顶上的环绕升镜是这部片的记忆点。","fit":"","quality":"full","prompt_chars":1747,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O49_洛奇.jpg"},{"id":"O50","name":"安妮·霍尔（Annie Hall）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"《纽约客》单格漫画：灵动的钢笔墨线、几块克制的淡彩、大量白纸，画下面一行手写图说。伍迪·艾伦的喜剧和这本杂志是一个调子，龙虾那场戏正好是一格笑话漫画。","fit":"","quality":"full","prompt_chars":1787,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O50_安妮·霍尔.jpg"},{"id":"O51","name":"猎鹿人（The Deer Hunter）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"仿安德鲁·怀斯的蛋彩：干燥细密的交叉短笔，低饱和的草黄、赭褐、灰绿，草叶一根根画出来，天空苍白。怀斯是宾州画家，“一枪”猎鹿就在宾州钢铁小镇上方的山里。","fit":"","quality":"full","prompt_chars":1711,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O51_猎鹿人.jpg"},{"id":"O52","name":"克莱默夫妇（Kramer vs. Kramer）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"孩子用蜡笔画的厨房：歪扭的线、用力涂进纸纹又涂出边界的颜色、标签和箭头、带笑脸的太阳。这是比利眼里他和爸爸做法式吐司的样子。","fit":"","quality":"full","prompt_chars":1799,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O52_克莱默夫妇.jpg"},{"id":"O53","name":"普通人（Ordinary People）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"层层叠色的透明水彩：湿画法的天空和湖面、水渍边线、回流花、留白的纸当高光，秋天的金和锈红配上冷灰蓝。对上影片开场那个安静又带点忧伤的 Lake Forest 秋天。","fit":"","quality":"full","prompt_chars":1810,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O53_普通人.jpg"},{"id":"O54","name":"烈火战车（Chariots of Fire）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"仿 Jean Droit 1924 巴黎奥运海报的四色石印：古典人体、有限油墨、成团的石版颗粒、参差套色。《烈火战车》讲的是 1924 年奥运，海滩长跑像那张海报活了过来。","fit":"","quality":"full","prompt_chars":1808,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O54_烈火战车.jpg"},{"id":"O55","name":"甘地传（Gandhi）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"棉布上的手工木刻印花：靛蓝、茜草红、姜黄加黑色雕版轮廓，版缝处套色错位，染料顺着经纬渗开。手纺土布是甘地的象征，所以食盐进军就印成一块布。","fit":"","quality":"full","prompt_chars":1698,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O55_甘地传.jpg"},{"id":"O56","name":"母女情深（Terms of Endearment）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"摊开的家庭相册，里面是褪色的宝丽来和柯达快照：发青的黑、奶油色高光、白边。其中一张宝丽来活过来，变成海滩飞车的追拍照片。《母女情深》讲的是母女三十年。","fit":"","quality":"full","prompt_chars":1753,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O56_母女情深.jpg"},{"id":"O57","name":"莫扎特传（Amadeus）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"黑纸剪成的侧面人像镶着金边，坐满马蹄形的金色包厢和红丝绒，对着星空布景的舞台。《莫扎特传》的高光是首演之夜，一个画面装下乐池、舞台、观众和暗处的萨列里。","fit":"","quality":"full","prompt_chars":1741,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O57_莫扎特传.jpg"},{"id":"O58","name":"走出非洲（Out of Africa）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"实时 3D 的低空飞行：铬黄色双翼机掠过苏打湖，上万只火烈鸟惊起，琥珀色薄雾光。这部片最被记住的就是丹尼斯带凯伦飞越肯尼亚，和她向后座伸出的那只手。","fit":"","quality":"full","prompt_chars":1757,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O58_走出非洲.jpg"},{"id":"O59","name":"野战排（Platoon）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"快而有力的钢笔线，橄榄绿、土黄、烟灰和火光橙的淡彩，速写本纸四边留白。像随军画家在现场画下的，贴近这部片从步兵眼里看越战的视角。","fit":"","quality":"full","prompt_chars":1720,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O59_野战排.jpg"},{"id":"O60","name":"末代皇帝（The Last Emperor）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"绢本上的铁线描和层层渲染的石青、石绿、朱砂、泥金，界画的宫殿，几千名跪拜的百官。小皇帝的登基是清宫仪典，就用清宫画师记录仪典的画法来画。","fit":"","quality":"full","prompt_chars":1817,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O60_末代皇帝.jpg"},{"id":"O61","name":"雨人（Rain Man）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"平滑的喷枪渐变、硬边遮罩、镀铬高光和粉绿霓虹，叠一层细细的青色计数标注。80 年代画风配上雷蒙眼里的世界：82、82、82，共 246 根牙签，还有牌桌算牌。","fit":"","quality":"full","prompt_chars":1794,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O61_雨人.jpg"},{"id":"O62","name":"为黛西小姐开车（Driving Miss Daisy）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"扎实温暖的洛克威尔写实：边缘干净、笔触可见，午后阳光穿过橡树，邻居各忙各的。这部片就是 50 年代亚特兰大一辆车里的两个人，本身就像一张《星期六晚邮报》封面。","fit":"","quality":"full","prompt_chars":1844,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O62_为黛西小姐开车.jpg"},{"id":"O63","name":"与狼共舞（Dances with Wolves）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"一个军人的野外日记：轻重有变化的铅笔线、透明水彩、泛黄的布浆纸、墨水手写和页边的铅笔批注。邓巴在片中一直写画日记，所以草原是从他的速写里活过来的。","fit":"","quality":"full","prompt_chars":1738,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O63_与狼共舞.jpg"},{"id":"O64","name":"沉默的羔羊（The Silence of the Lambs）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"细密的铜版排线和点刻，上面薄薄地手工上色，图版编号和拉丁文标签印在泛黄的纸上。海报上的鬼脸天蛾本就该钉在标本图版上，同样冷峻的铜版画法一直延伸到莱克特的囚室。","fit":"","quality":"full","prompt_chars":1825,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O64_沉默的羔羊.jpg"},{"id":"O65","name":"不可饶恕（Unforgiven）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"两种调子的厚涂西部油画：雷明顿金红晚霞下的平原，和他晚年被暖黄窗光点亮的蓝绿夜景。《不可饶恕》以夕阳下坟前的剪影开场和收尾，决战发生在雨夜的小镇。","fit":"","quality":"full","prompt_chars":1737,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O65_不可饶恕.jpg"},{"id":"O66","name":"辛德勒的名单（Schindler's List）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"冷灰、高反差的黑白，粗颗粒，高光晕开；只有小女孩的红大衣和 Clawd 的橙色有颜色。这正是斯皮尔伯格的手法：红大衣和安息日烛火是全片仅有的彩色。","fit":"","quality":"full","prompt_chars":1770,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O66_辛德勒的名单.jpg"},{"id":"O67","name":"阿甘正传（Forrest Gump）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"平行折立起来的印刷卡片，白色纸芯、灰色纸板边、层与层之间的投影和浅景深，放在胡桃木书桌上。阿甘坐在长椅上把一生讲成故事，翻开一页就立起一段经历。","fit":"","quality":"full","prompt_chars":1673,"keywords":["2.5D"],"still":"prompts/O_奥斯卡98部/O67_阿甘正传.jpg"},{"id":"O68","name":"勇敢的心（Braveheart）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"一页中世纪手抄本：带冲压点的磨光金箔、青金石蓝、朱红、哥特体字，中间一幅窗口似的战役细密画。《勇敢的心》是苏格兰传奇，片尾那声 FREEDOM 做成泥金首字母。","fit":"","quality":"full","prompt_chars":1765,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O68_勇敢的心.jpg"},{"id":"O69","name":"英国病人（The English Patient）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"贴在旧书里的水彩速写，夹着地图、照片、便条和压花，整体是海报的琥珀褐。艾玛殊那本塞满画和笔记的希罗多德是全片的框架，镜头就穿过一张水彩进入游泳者洞穴。","fit":"","quality":"full","prompt_chars":1772,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O69_英国病人.jpg"},{"id":"O70","name":"泰坦尼克号（Titanic）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"普鲁士蓝晒图纸上的白线立起来、长出透视，再显影成夕阳下全彩的 3D 船，一路入夜。船本身就是这部片的标志，所以船厂图纸和实景用的是同一艘模型。","fit":"","quality":"full","prompt_chars":1756,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O70_泰坦尼克号.jpg"},{"id":"O71","name":"莎翁情史（Shakespeare in Love）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"学尼古拉斯·希利亚德的伊丽莎白时代宫廷细密画：羊皮纸上的不透明水彩、群青底、贝壳金题字、白色野蔷薇。影片发生在莎士比亚的伦敦，细密画正是那个宫廷自己的肖像形式。","fit":"","quality":"full","prompt_chars":1813,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O71_莎翁情史.jpg"},{"id":"O72","name":"美国丽人（American Beauty）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"两种画面剪在一起：先是干净饱和、正面对称的郊区住宅（红门、红玫瑰），再切到带 REC 界面的低清 DV 录像。对应影片里莱斯特体面的郊区和里基拍下的那段塑料袋录像。","fit":"","quality":"full","prompt_chars":1748,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O72_美国丽人.jpg"},{"id":"O73","name":"角斗士（Gladiator）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"整幅画用方形石子和玻璃嵌片铺成：轮廓边的石子顺着形体排，平面处一行行直排，金箔玻璃片会闪。影片本身就在罗马，所以斗兽场和极乐麦田都做成罗马地面马赛克。","fit":"","quality":"full","prompt_chars":1710,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O73_角斗士.jpg"},{"id":"O74","name":"美丽心灵（A Beautiful Mind）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"两种表面上的手写数学：哥特式图书馆窗玻璃上的白色油性笔、黑板上的粉笔，数字亮起，被金线连起来。这是片中纳什看见规律的方式：是他脑中的光，不是电脑界面。","fit":"","quality":"full","prompt_chars":1686,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O74_美丽心灵.jpg"},{"id":"O75","name":"芝加哥（Chicago）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"黑色舞台被硬边聚光切开：六间牢房里是勾红边的女囚剪影，背后霓虹 C，亮片和烟雾，Clawd 在白色追光里。这是电影版的「Cell Block Tango」，用海报的红黑。","fit":"","quality":"full","prompt_chars":1655,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O75_芝加哥.jpg"},{"id":"O76","name":"指环王：王者无敌（The Lord of the Rings: The Return of the King）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"柔和的水彩加铅笔风景，空气透视很深，再加一张羊皮纸上的墨线地图。电影的概念画就是艾伦·李和约翰·豪画的，所以这段旅程按三部曲最初被画出来的样子来讲。","fit":"","quality":"full","prompt_chars":1796,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O76_指环王：王者无敌.jpg"},{"id":"O77","name":"百万美元宝贝（Million Dollar Baby）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"原创的 16-bit 街机格斗游戏画面：血条、回合计时、ROUND 1 / FIGHT!、连击数、命中停顿和巨大的 K.O.。一部拳击冠军赛的电影，变成用街机语法打完的一回合。","fit":"","quality":"full","prompt_chars":1658,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O77_百万美元宝贝.jpg"},{"id":"O78","name":"撞车（Crash）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"用代码画的精修夜景照片：高架上白色和红色的车灯光轨、钠灯橙对霓虹青、湿路面反光、焦外光斑，还有只在光里才看得见的雪。《撞车》的结尾正是洛杉矶难得的一场雪。","fit":"","quality":"full","prompt_chars":1710,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O78_撞车.jpg"},{"id":"O79","name":"无间行者（The Departed）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"平涂的多层喷漆模板，有喷雾毛边和流挂，漆吃进砖缝，旁边一张撕破的糊贴海报。《无间行者》最后一个镜头是老鼠爬过州议会金顶下的栏杆，街头模板涂鸦也一直爱画老鼠。","fit":"","quality":"full","prompt_chars":1729,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O79_无间行者.jpg"},{"id":"O80","name":"老无所依（No Country for Old Men）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"实时 3D 的西德州黄昏荒原：太阳压在地平线上，长影子朝着镜头，低饱和的土黄和灰绿，细颗粒。照着迪金斯为科恩兄弟拍的光，和海报上逆光里提着箱子的人。","fit":"","quality":"full","prompt_chars":1673,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O80_老无所依.jpg"},{"id":"O81","name":"贫民窟的百万富翁（Slumdog Millionaire）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"蓝紫色加金色高光的电视演播室，摇头灯光束、镜头光斑；然后切到饱和橙青色的孟买屋顶。影片本身就在答题节目的最后一题和贾马尔出身的贫民窟之间来回切。","fit":"","quality":"full","prompt_chars":1774,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O81_贫民窟的百万富翁.jpg"},{"id":"O82","name":"拆弹部队（The Hurt Locker）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"一页美军拆弹手册：均匀黑线、排线阴影、点描沙土、带圈编号和引线、IED 分解图，只有一点橄榄绿和沙色。《拆弹部队》讲高压下的程序，手册图就是画出来的程序。","fit":"","quality":"full","prompt_chars":1804,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O82_拆弹部队.jpg"},{"id":"O83","name":"国王的演讲（The King's Speech）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"墙面肌理很重的油画质感室内：罗格诊室那面冷灰绿的多层斑驳墙，再到琥珀金的软包广播间、弹簧吊着的话筒和细细的金色声波。照着 Eve Stewart 设计的墙和海报的金黄。","fit":"","quality":"full","prompt_chars":1749,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O83_国王的演讲.jpg"},{"id":"O84","name":"艺术家（The Artist）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"干净发亮的黑白：高光明亮、灰阶柔和，装饰艺术边框的字幕卡，轻微闪烁和颗粒；Clawd 是唯一的颜色。《艺术家》是 2011 年写给默片好莱坞的情书，所以比第 1 部更精致。","fit":"","quality":"full","prompt_chars":1824,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O84_艺术家.jpg"},{"id":"O85","name":"逃离德黑兰（Argo）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"摊在制片桌上的 70 年代柯比漫画：粗墨线、柯比能量泡、泛黄新闻纸上的四色网点。片中那部假科幻片用的正是柯比画的概念图，所以漫画从假史诗一路翻到真实的跑道出逃。","fit":"","quality":"full","prompt_chars":1445,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O85_逃离德黑兰.jpg"},{"id":"O86","name":"为奴十二年（12 Years a Slave）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"铜框丝绒盒里的 1850 年代银版照片，从空白显影：椅子上靠着小提琴，Clawd 低头站在旁边。这是所罗门·诺瑟普那个年代的照相术，只用一件物件讲这部片，不画人。","fit":"","quality":"full","prompt_chars":1551,"keywords":["2D·B&W"],"still":"prompts/O_奥斯卡98部/O86_为奴十二年.jpg"},{"id":"O87","name":"鸟人（Birdman）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"细致的 3D 百老汇剧院后台，用手持长镜头拍：暖钨丝灯对冷日光灯，最后冲进时代广场的强光。《鸟人》最出名的就是假装一镜到底，所以这段的风格就是那条运镜。","fit":"","quality":"full","prompt_chars":1793,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O87_鸟人.jpg"},{"id":"O88","name":"聚焦（Spotlight）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"印成报纸网点的画面，放到缩微胶片阅读机的灰绿屏幕上：扫描线、滚动的扫描光带、玻璃上的灰尘。片中记者就在这种档案里挖出真相，换镜头也做成胶片横移。","fit":"","quality":"full","prompt_chars":1725,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O88_聚焦.jpg"},{"id":"O89","name":"月光男孩（Moonlight）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"饱满的青绿、品红和月光蓝油画肖像，雕出来的头像再用顺着形体的笔触重新画一遍。直接照着片名那句「月光下，黑人男孩看起来是蓝色的」来画。","fit":"","quality":"full","prompt_chars":1669,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O89_月光男孩.jpg"},{"id":"O90","name":"水形物语（The Shape of Water）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"实时 3D 的被淹浴室和实验室水箱，整片浸在青绿里：流动的焦散、从上方落下的光束、气泡和几盏暖色灯。德尔·托罗这部片就泡在这种水里，所以整段在水中拍。","fit":"","quality":"full","prompt_chars":1778,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O90_水形物语.jpg"},{"id":"O91","name":"绿皮书（Green Book）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"一张「南方问候」亚麻纹明信片活了过来：布纹纸、喷枪上的饱和色、镀铬上的星形闪光。影片是 1962 年穿越美国南方的公路旅行，走的正是这种明信片上的路。","fit":"","quality":"full","prompt_chars":1671,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O91_绿皮书.jpg"},{"id":"O92","name":"寄生虫（Parasite）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"一张剖开首尔山坡的建筑剖面图：山顶的玻璃豪宅、地下的秘密掩体、一路通到被淹的半地下室，细线、柔和的材质色。《寄生虫》建在这种上下的阶级落差上，一张图装下整部片。","fit":"","quality":"full","prompt_chars":1748,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O92_寄生虫.jpg"},{"id":"O93","name":"无依之地（Nomadland）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"灰紫色纸上的粉质色粉笔触，一片开阔的平原和一辆旧房车，天空从金黄变成玫瑰色再到紫色。《无依之地》就活在黄昏那条又长又空的地平线上，色粉让它安静、柔和。","fit":"","quality":"full","prompt_chars":1507,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O93_无依之地.jpg"},{"id":"O94","name":"健听女孩（CODA）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"橡木桌上一颗抛光的抹香鲸牙，刻着细密的黑线，点缀红、蓝、黄：格洛斯特的渔船、收网的一家人、船头唱歌的鲁比。这是影片所在的新英格兰海岸自己的民间工艺。","fit":"","quality":"full","prompt_chars":1600,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O94_健听女孩.jpg"},{"id":"O95","name":"瞬息全宇宙（Everything Everywhere All at Once）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"四个宇宙四种画法，全部实时光线步进：冷绿的国税局、广告光下的热狗手指钢琴、贴大眼睛石头的寂静峡谷、变成黑洞的万物贝果。像电影里一样，靠大眼睛贴纸在宇宙间跳转。","fit":"","quality":"full","prompt_chars":2096,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O95_瞬息全宇宙.jpg"},{"id":"O96","name":"奥本海默（Oppenheimer）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"用实时 3D 重建黎明前的三位一体试验场：约 72 万粒子的火球、轨道和波组成的量子幻象，深蓝夜色对橙金火光，加 IMAX 式颗粒。《奥本海默》就围着这一道光展开。","fit":"","quality":"full","prompt_chars":1822,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O96_奥本海默.jpg"},{"id":"O97","name":"阿诺拉（Anora）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"粉、青、橙的霓虹灯管发着光，倒影拖在湿栈道上，落进飘雪里，加上辉光、虚焦光斑和颗粒。《阿诺拉》从布莱顿海滩的俄文霓虹走到维加斯的婚礼招牌，整段都用灯管照亮。","fit":"","quality":"full","prompt_chars":1699,"keywords":["2D"],"still":"prompts/O_奥斯卡98部/O97_阿诺拉.jpg"},{"id":"O98","name":"一战再战（One Battle After Another）","cat":"O_奥斯卡98部","cat_label":"O 奥斯卡 98 部","look":"实时 3D 的沙漠公路，像过山车一样一起一伏，三辆车翻着一道道坡追逐，用超长焦拍，带热浪、漂白的强光和细颗粒。复刻的是这部片最有名的段落：起伏公路追车。","fit":"","quality":"full","prompt_chars":1822,"keywords":["3D"],"still":"prompts/O_奥斯卡98部/O98_一战再战.jpg"},{"id":"R1","name":"霓虹雨夜 · 电影感","cat":"R_照参考学来的","cat_label":"R 照参考学来的","look":"一点透视的雨夜窄街，两边挂满竖招牌，青色的雾越远越浓，街尽头一团暖光；湿地面上的倒影占了半个画面。","fit":"","quality":"short","prompt_chars":196,"keywords":[],"still":"prompts/R_照参考学来的/R1_霓虹雨夜 · 电影感.jpg"},{"id":"R2","name":" const state = { cat: DATA.default_cat || "all", q: "", onlyStill: false, onlyFull: false,
                hideNoPrompt: true, sel: null };
const grid = document.getElementById("grid");
const side = document.getElementById("side");
const sheetMask = document.getElementById("sheetMask");
const mask = document.getElementById("mask");
const dCode = document.getElementById("d-code");
const dK = document.getElementById("d-k");
const dNm = document.getElementById("d-nm");
const dTip = document.getElementById("d-tip");

const mqSheet = window.matchMedia("(max-width:1023px)");
const mqPhone = window.matchMedia("(max-width:767px)");
const mqTouch = window.matchMedia("(pointer: coarse)");
const isSheet = () => mqSheet.matches;
const isPhone = () => mqPhone.matches;

/* 相对路径 → URL（文件名里有中文、空格、括号，逐段编码最稳） */
const url = p => p.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function badges(e){
  const t = [];
  if (!e.still) t.push('<span class="tag">无预留图</span>');
  if (e.quality === "short") t.push('<span class="tag warn">提示词短</span>');
  if (e.quality === "empty") t.push('<span class="tag warn">提示词缺</span>');
  return t.join("");
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.entries.filter(e => {
    if (state.cat !== "all" && e.cat !== state.cat) return false;
    if (state.hideNoPrompt && e.quality === "empty") return false;
    if (state.onlyStill && !e.still) return false;
    if (state.onlyFull && e.quality !== "full") return false;
    if (!q) return true;
    const hay = (e.id + " " + e.name + " " + e.cat_label + " " + e.look + " " + e.fit
                 + " " + (e.keywords || []).join(" ")).toLowerCase();
    return hay.includes(q);
  });
}

function render(){
  const rows = filtered();
  const hidden = DATA.entries.length - rows.length;
  const cat = DATA.cats.find(c => c.cat === state.cat);
  document.getElementById("count").textContent = isPhone()
    ? `${rows.length}/${DATA.entries.length}` + (cat ? "" : ` · 有图 ${DATA.with_still}`)
    : `显示 ${rows.length} / ${DATA.entries.length} 条` + (hidden ? `（筛掉 ${hidden}）` : "")
      + (cat ? ` · ${cat.label}` : ` · 有预留图 ${DATA.with_still}`);
  if (!rows.length){
    grid.innerHTML = '<div class="empty">没有符合条件的。把上面的筛选关掉试试。</div>';
    return;
  }
  grid.innerHTML = rows.map(e => `
    <div class="card ${state.sel === e.id ? "on" : ""}" data-id="${esc(e.id)}">
      ${e.still
        ? `<img class="thumb" loading="lazy" src="${url(e.still)}" alt="${esc(e.name)}">`
        : `<div class="noimg">无预留画风图</div>`}
      <div class="meta">
        <div class="nm">${esc(e.name)}</div>
        <div class="id"><span>${esc(e.id)}</span>${badges(e)}</div>
      </div>
    </div>`).join("");
}

function openSheet(){
  if (!isSheet()) return;
  side.classList.add("open");
  sheetMask.classList.add("on");
  document.body.classList.add("lock");
}

function closeSheet(){
  side.classList.remove("open");
  sheetMask.classList.remove("on");
  document.body.classList.remove("lock");
}

function detail(e, open){
  state.sel = e.id;
  const cur = DATA.current === e.id ? ' <span class="now">当前已选</span>' : "";
  side.innerHTML = `
    <div class="handle"></div>
    <div class="panel">
      <button class="x" id="sheet-x" aria-label="关闭">×</button>
      <div class="panel-scroll">
        ${e.still
          ? `<img class="big" src="${url(e.still)}" alt="${esc(e.name)}">`
          : `<div class="nopic">这条没有预留画风图<br>只能按下面的文字描述判断</div>`}
        <h2>${esc(e.name)}</h2>
        <div class="sub">${esc(e.id)} · ${esc(e.cat_label)}${cur}</div>
        <div class="kv"><b>长什么样</b>${esc(e.look) || "（原库没写）"}</div>
        <div class="kv"><b>适合</b>${esc(e.fit) || "（原库没写）"}</div>
        <div class="kv"><b>提示词</b>${e.prompt_chars} 字符${e.quality !== "full" ? "（偏短，细节要 AI 补）" : ""}</div>
      </div>
      <div class="panel-foot">
        <button class="go" id="go">就选这个画风</button>
        <div class="hint">点一下，编号自动复制。${mqTouch.matches ? "切回对话窗口长按粘贴就行。" : "回对话窗口按 Ctrl+V 粘给我就行，不用手抄。"}</div>
      </div>
    </div>`;
  document.getElementById("go").onclick = () => choose(e);
  document.getElementById("sheet-x").onclick = closeSheet;
  const sc = side.querySelector(".panel-scroll");
  if (sc) sc.scrollTop = 0;
  if (open !== false) openSheet();
  render();
}

async function copyText(text){
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(err){ /* 继续走兜底 */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(err){ return false; }
}

async function choose(e){
  const ok = await copyText(e.id);
  dCode.value = e.id;
  dNm.textContent = e.name + " · " + e.cat_label;
  dK.textContent = ok ? "已复制画风编号" : "没能自动复制，编号已选中";
  dK.className = "k" + (ok ? "" : " bad");
  dTip.innerHTML = ok
    ? (mqTouch.matches
        ? "已经复制好了。切回对话窗口，在输入框里<b>长按 → 粘贴</b>，把编号发给我，我就按这条画风的提示词做片。"
        : "回对话窗口按 <b>Ctrl+V</b>（Mac 是 <b>⌘V</b>）把编号粘给我，我就按这条画风的提示词做片。")
    : "浏览器拦了剪贴板（本地 html 偶发）。这行编号已经选中，按 <b>Ctrl+C</b> 复制，再粘给我。";
  mask.classList.add("on");
  if (!ok){ dCode.focus(); dCode.select(); }
  DATA.current = e.id;
  render();
}

/* 手机上关掉复制弹窗就顺手退回网格（接下来就是去聊天窗口粘贴了） */
document.getElementById("d-close").onclick = () => {
  mask.classList.remove("on");
  if (isSheet()) closeSheet();
};
document.getElementById("d-again").onclick = async () => {
  const ok = await copyText(dCode.value);
  dK.textContent = ok ? "已复制画风编号" : "还是没复制成功，手动选中按 Ctrl+C";
  dK.className = "k" + (ok ? "" : " bad");
  if (!ok){ dCode.focus(); dCode.select(); }
};
mask.addEventListener("click", ev => { if (ev.target === mask) mask.classList.remove("on"); });
sheetMask.onclick = closeSheet;

document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (mask.classList.contains("on")) mask.classList.remove("on");
  else closeSheet();
});

grid.addEventListener("click", ev => {
  const card = ev.target.closest(".card");
  if (!card) return;
  const e = DATA.entries.find(x => x.id === card.dataset.id);
  if (e) detail(e);
});
/* 桌面双击 = 直接复制；手机上双击会被当成缩放，不绑 */
grid.addEventListener("dblclick", ev => {
  if (isSheet()) return;
  const card = ev.target.closest(".card");
  if (!card) return;
  const e = DATA.entries.find(x => x.id === card.dataset.id);
  if (e) choose(e);
});

document.getElementById("cats").innerHTML = DATA.cats.map(c =>
  `<button class="chip" data-cat="${esc(c.cat)}" title="共 ${c.n} 条">${esc(c.label)}</button>`).join("");

function syncChips(){
  document.querySelectorAll(".chip[data-cat]").forEach(x =>
    x.classList.toggle("on", state.cat === "all" ? x.dataset.cat === "all" : x.dataset.cat === state.cat));
  document.getElementById("f-still").classList.toggle("on", state.onlyStill);
  document.getElementById("f-full").classList.toggle("on", state.onlyFull);
  document.getElementById("f-empty").classList.toggle("on", state.hideNoPrompt);
}

document.querySelectorAll(".chip[data-cat]").forEach(b => b.onclick = () => {
  state.cat = b.dataset.cat;
  syncChips();
  render();
});
document.getElementById("f-still").onclick = () => { state.onlyStill = !state.onlyStill; syncChips(); render(); };
document.getElementById("f-full").onclick = () => { state.onlyFull = !state.onlyFull; syncChips(); render(); };
document.getElementById("f-empty").onclick = () => { state.hideNoPrompt = !state.hideNoPrompt; syncChips(); render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

/* 筛选栏吸顶，高度量出来给右侧详情面板对齐 */
function syncTop(){
  const h = document.querySelector(".bars").offsetHeight;
  document.documentElement.style.setProperty("--top", h + "px");
}
window.addEventListener("resize", () => {
  syncTop();
  render();
  if (!isSheet()) closeSheet();   // 从窄屏拉宽：抽屉状态要收掉，否则 body 还锁着滚动
});

if (DATA.current){
  const e = DATA.entries.find(x => x.id === DATA.current);
  if (e) detail(e, false);
}
syncTop();
syncChips();
render();

/* 默认选中的分类可能不在可视范围（分类条横向滚动），开页时把它带到眼前 */
(function revealDefaultCat(){
  const chip = document.querySelector('.catrow .chip[data-cat].on');
  if (chip) chip.scrollIntoView({block: "nearest", inline: "center"});
})();
